
services:
  discovery-server:
    build: ./backend/discovery-server
    ports: ["8761:8761"]
    networks: [net]

  api-gateway:
    build: ./backend/api-gateway
    ports: ["8080:8080"]
    depends_on: [discovery-server]
    networks: [net]

  auth-service:
    build: ./backend/auth-service
    ports: ["8091:8091"]
    depends_on: [discovery-server]
    networks: [net]

  user-service:
    build: ./backend/user-service
    ports: ["8092:8092"]
    depends_on: [discovery-server]
    networks: [net]

  patient-service:
    build: ./backend/patient-service
    ports: ["8093:8093"]
    depends_on: [discovery-server]
    networks: [net]

  doctor-service:
    build: ./backend/doctor-service
    ports: ["8094:8094"]
    depends_on: [discovery-server, medical-record-service]
    networks: [net]

  appointment-service:
    build: ./backend/appointment-service
    ports: ["8095:8095"]
    depends_on: [discovery-server]
    networks: [net]

  medical-record-service:
    build: ./backend/medical-record-service
    ports: ["8096:8096"]
    depends_on: [discovery-server]
    networks: [net]

  admin-service:
    build: ./backend/admin-service
    ports: ["8097:8097"]
    depends_on: [discovery-server, appointment-service]
    networks: [net]

  notification-service:
    build: ./backend/notification-service
    ports: ["8098:8098"]
    depends_on: [discovery-server]
    networks: [net]

  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8080
    depends_on: [api-gateway]
    networks: [net]

networks:
  net:
    driver: bridge
