server: { port: 8080 }
spring:
  application: { name: api-gateway }
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates: [ Path=/api/auth/** ]
        - id: user-service
          uri: lb://USER-SERVICE
          predicates: [ Path=/api/users/** ]
        - id: patient-service
          uri: lb://PATIENT-SERVICE
          predicates: [ Path=/api/patients/** ]
        - id: doctor-service
          uri: lb://DOCTOR-SERVICE
          predicates: [ Path=/api/doctors/** ]
        - id: appointment-service
          uri: lb://APPOINTMENT-SERVICE
          predicates: [ Path=/api/appointments/** ]
        - id: medical-record-service
          uri: lb://MEDICAL-RECORD-SERVICE
          predicates: [ Path=/api/records/** ]
        - id: admin-service
          uri: lb://ADMIN-SERVICE
          predicates: [ Path=/api/admin/** ]
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates: [ Path=/api/notifications/** ]
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000}"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
    discovery:
      locator:
        enabled: true
        # optional, but harmless if you later rely on auto-discovery routes
        lowerCaseServiceId: true
eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8761/eureka
  instance:
    prefer-ip-address: true
