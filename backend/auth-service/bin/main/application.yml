
server: { port: 8091 }
spring:
  application: { name: auth-service }
  datasource:
    url: jdbc:mysql://mysql:3306/auth_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: amal
    password: amal
  jpa: { hibernate: { ddl-auto: validate } }
  flyway: { enabled: true, locations: classpath:db/migration }
eureka:
  client: { serviceUrl: { defaultZone: http://discovery-server:8761/eureka } }
  instance: { prefer-ip-address: true }
